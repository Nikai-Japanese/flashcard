<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Warna - Flashcards</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top, #cbd5e1 0%, #94a3b8 100%);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* 上部ヘッダー（カギボタン配置用） */
    .top-header {
      display: flex;
      justify-content: flex-end;
      padding: 16px 24px 0;
      height: 60px;
    }

    /* スタイリッシュな丸型カギボタン */
    .mode-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      display: none; /* スタート前は非表示 */
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s, transform 0.1s;
      user-select: none;
    }

    /* 練習モード（🔓 開いたカギ：ハッキリわかる明るいエメラルドグリーン系） */
    .mode-btn.practice {
      background-color: rgba(16, 185, 129, 0.9);
    }

    /* テストモード（🔒 閉じたカギ：重厚なダークスレート系） */
    .mode-btn.test {
      background-color: rgba(30, 41, 59, 0.9);
    }

    .mode-btn:active {
      transform: scale(0.92);
    }

    /* メインのカードエリア */
    .card-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 24px 0;
      min-height: 0;
    }

    .card {
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: 540px;
      background-color: transparent;
      border-radius: 28px;
      box-shadow: none;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
      user-select: none;
    }

    .card:active {
      transform: scale(0.97);
    }

    /* 最初の画面の大きな「TAP」表示 */
    .start-tap {
      display: block;
      font-size: clamp(4.5rem, 18vw, 7.5rem);
      font-weight: 900;
      letter-spacing: 6px;
      color: #1e293b;
      text-align: center;
      pointer-events: none;
    }

    /* 答えのテキスト */
    .indonesian-word {
      display: none;
      font-size: clamp(3.8rem, 16vw, 6.75rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: none;
      pointer-events: none;
    }

    .indonesian-word.visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.2s ease;
    }

    /* 下部の矢印ボタンエリア */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 48px;
      padding: 20px 20px 32px;
    }

    .nav-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background-color: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      color: #1e293b;
      font-size: 1.8rem;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.65);
    }

    .nav-btn:active {
      transform: scale(0.92);
      background-color: rgba(255, 255, 255, 0.8);
    }

    /* 横向き（ランドスケープ）時のレイアウト調整 */
    @media (orientation: landscape) and (max-height: 500px) {
      .top-header {
        padding: 10px 24px 0;
        height: 40px;
      }
      .card-container {
        padding: 6px 24px 0;
      }
      .controls {
        padding: 10px 20px 16px;
        gap: 60px;
      }
      .nav-btn {
        width: 50px;
        height: 50px;
        font-size: 1.3rem;
      }
      .start-tap {
        font-size: 5.5rem;
      }
      .indonesian-word {
        font-size: 4.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="top-header">
    <button class="mode-btn practice" id="mode-btn" aria-label="Toggle Mode">🔓</button>
  </div>

  <div class="card-container">
    <div class="card" id="card">
      <div class="start-tap" id="start-tap">TAP</div>
      <div class="indonesian-word" id="indo-text"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev-btn" aria-label="Previous">←</button>
    <button class="nav-btn" id="next-btn" aria-label="Next">→</button>
  </div>

  <script>
    const baseColors = [
      { hex: "#E53935", indo: "Merah",   textColor: "#FFFFFF" },
      { hex: "#1E88E5", indo: "Biru",    textColor: "#FFFFFF" },
      { hex: "#FDD835", indo: "Kuning",  textColor: "#1E293B" },
      { hex: "#43A047", indo: "Hijau",   textColor: "#FFFFFF" },
      { hex: "#111827", indo: "Hitam",   textColor: "#FFFFFF" },
      { hex: "#FFFFFF", indo: "Putih",   textColor: "#1E293B" },
      { hex: "#FB8C00", indo: "Oranye",  textColor: "#FFFFFF" },
      { hex: "#6D4C41", indo: "Cokelat", textColor: "#FFFFFF" },
      { hex: "#8E24AA", indo: "Ungu",    textColor: "#FFFFFF" }
    ];

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let colors = shuffleArray(baseColors);
    let currentIndex = 0;
    let isStarted = false;
    let isAnswerShown = false;
    let isPracticeMode = true; // 初期状態は練習モード（🔓 解除）

    const card = document.getElementById("card");
    const startTap = document.getElementById("start-tap");
    const indoText = document.getElementById("indo-text");
    const modeBtn = document.getElementById("mode-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    function startQuiz() {
      isStarted = true;
      startTap.style.display = "none";
      indoText.style.display = "block";
      modeBtn.style.display = "flex"; // スタート後にボタンを表示
      isAnswerShown = isPracticeMode;
      updateCard();
    }

    function updateCard() {
      const current = colors[currentIndex];
      
      card.style.backgroundColor = current.hex;

      if (current.indo === "Putih") {
        card.style.boxShadow = "0 18px 36px rgba(15, 23, 42, 0.25), inset 0 0 0 2px #cbd5e1";
      } else if (current.indo === "Hitam") {
        card.style.boxShadow = "0 18px 36px rgba(15, 23, 42, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.25)";
      } else {
        card.style.boxShadow = "0 18px 36px rgba(15, 23, 42, 0.22), inset 0 0 0 2px rgba(255, 255, 255, 0.35)";
      }

      indoText.textContent = current.indo;
      indoText.style.color = current.textColor;

      if (isAnswerShown) {
        indoText.classList.add("visible");
      } else {
        indoText.classList.remove("visible");
      }
    }

    // ボタンをクリックするたびに「🔓緑（解除）」と「🔒ダーク（ロック）」がハッキリ切り替わる
    modeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      isPracticeMode = !isPracticeMode;
      
      if (isPracticeMode) {
        modeBtn.className = "mode-btn practice";
        modeBtn.textContent = "🔓";
        isAnswerShown = true;
      } else {
        modeBtn.className = "mode-btn test";
        modeBtn.textContent = "🔒";
        isAnswerShown = false;
      }
      updateCard();
    });

    // カードタップ時
    card.addEventListener("click", () => {
      if (!isStarted) {
        startQuiz();
      } else if (isPracticeMode) {
        currentIndex++;
        if (currentIndex >= colors.length) {
          colors = shuffleArray(baseColors);
          currentIndex = 0;
        }
        updateCard();
      } else {
        isAnswerShown = !isAnswerShown;
        updateCard();
      }
    });

    // 戻るボタン
    prevBtn.addEventListener("click", () => {
      if (!isStarted) {
        startQuiz();
        return;
      }
      currentIndex = (currentIndex - 1 + colors.length) % colors.length;
      isAnswerShown = isPracticeMode;
      updateCard();
    });

    // 次へボタン
    nextBtn.addEventListener("click", () => {
      if (!isStarted) {
        startQuiz();
        return;
      }
      currentIndex++;
      if (currentIndex >= colors.length) {
        colors = shuffleArray(baseColors);
        currentIndex = 0;
      }
      isAnswerShown = isPracticeMode;
      updateCard();
    });
  </script>

</body>
</html>
