<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Warna - Flashcards</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      color: #f8fafc;
    }

    /* 上部のカウンター */
    .header {
      text-align: center;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #94a3b8;
    }

    /* メインのカードエリア */
    .card-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 24px;
      min-height: 0;
    }

    .card {
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: 550px;
      border-radius: 28px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
      user-select: none;
    }

    .card:active {
      transform: scale(0.97);
    }

    /* 答えのテキスト */
    .indonesian-word {
      font-size: 4.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: none;
      pointer-events: none;
    }

    .indonesian-word.visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.2s ease;
    }

    /* 下部の矢印ボタンエリア */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 48px;
      padding: 22px 20px 32px;
    }

    .nav-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background-color: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      color: #f8fafc;
      font-size: 1.8rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s, transform 0.1s, border-color 0.2s;
    }

    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .nav-btn:active {
      transform: scale(0.92);
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* 横向き（ランドスケープ）時のレイアウト調整 */
    @media (orientation: landscape) and (max-height: 500px) {
      .header {
        padding: 8px;
        font-size: 0.9rem;
      }
      .controls {
        padding: 12px 20px 16px;
        gap: 60px;
      }
      .nav-btn {
        width: 54px;
        height: 54px;
        font-size: 1.4rem;
      }
      .indonesian-word {
        font-size: 3.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="header" id="counter">TAP</div>

  <div class="card-container">
    <div class="card" id="card" style="background-color: #334155;">
      <div class="indonesian-word" id="indo-text"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prev-btn" aria-label="Previous">←</button>
    <button class="nav-btn" id="next-btn" aria-label="Next">→</button>
  </div>

  <script>
    const baseColors = [
      { hex: "#E53935", indo: "Merah",   textColor: "#FFFFFF" },
      { hex: "#1E88E5", indo: "Biru",    textColor: "#FFFFFF" },
      { hex: "#FDD835", indo: "Kuning",  textColor: "#1E293B" },
      { hex: "#43A047", indo: "Hijau",   textColor: "#FFFFFF" },
      { hex: "#18181B", indo: "Hitam",   textColor: "#FFFFFF" },
      { hex: "#FFFFFF", indo: "Putih",   textColor: "#1E293B" },
      { hex: "#FB8C00", indo: "Oranye",  textColor: "#FFFFFF" },
      { hex: "#6D4C41", indo: "Cokelat", textColor: "#FFFFFF" }
    ];

    // 配列をランダムにシャッフルする関数（Fisher-Yatesアルゴリズム）
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let colors = shuffleArray(baseColors);
    let currentIndex = 0;
    let isStarted = false;
    let isAnswerShown = false;

    const card = document.getElementById("card");
    const counter = document.getElementById("counter");
    const indoText = document.getElementById("indo-text");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    function updateCard() {
      const current = colors[currentIndex];
      
      counter.textContent = `${currentIndex + 1} / ${colors.length}`;
      card.style.backgroundColor = current.hex;

      if (!isAnswerShown) {
        indoText.classList.remove("visible");
        indoText.textContent = "";
      } else {
        indoText.textContent = current.indo;
        indoText.style.color = current.textColor;
        indoText.classList.add("visible");
      }
    }

    card.addEventListener("click", () => {
      if (!isStarted) {
        isStarted = true;
        isAnswerShown = false;
        updateCard();
      } else {
        isAnswerShown = !isAnswerShown;
        updateCard();
      }
    });

    prevBtn.addEventListener("click", () => {
      if (!isStarted) isStarted = true;
      currentIndex = (currentIndex - 1 + colors.length) % colors.length;
      isAnswerShown = false;
      updateCard();
    });

    nextBtn.addEventListener("click", () => {
      if (!isStarted) isStarted = true;
      currentIndex = (currentIndex + 1) % colors.length;
      // 最後のカードから「次へ」で一周した時に新しくシャッフルし直したい場合は、
      // ここに if (currentIndex === 0) colors = shuffleArray(baseColors); を入れることも可能です
      isAnswerShown = false;
      updateCard();
    });
  </script>

</body>
</html>
